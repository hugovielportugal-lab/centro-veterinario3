<style>
  :root{
    --navy:#002845; --turq:#00949C; --white:#fff;
    --gray:#6e7880; --line:#e2e6e8; --bg:#f4f7f8;
  }
  *{box-sizing:border-box;}
  body{ font-family:'Poppins',Arial,sans-serif; margin:0; background:var(--bg); color:var(--navy); }
  header{
    background:var(--navy); color:#fff; padding:22px 28px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  header h1{font-size:19px; margin:0; font-weight:600;}
  header p{margin:2px 0 0; font-size:13px; color:#9fb3c2;}
  .layout{display:grid; grid-template-columns: 360px 1fr; gap:0; min-height:calc(100vh - 74px);}
  .panel{background:#fff; padding:24px; border-right:1px solid var(--line); overflow-y:auto; max-height:calc(100vh - 74px);}
  .panel h2{font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--gray); margin:0 0 14px;}
  label{display:block; font-size:13px; font-weight:500; margin:14px 0 6px;}
  input, select{
    width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; color:var(--navy);
  }
  input:focus, select:focus{outline:none; border-color:var(--turq);}
  button{ cursor:pointer; border:none; border-radius:8px; font-family:inherit; font-weight:600; }
  .btn-primary{ background:var(--turq); color:#fff; padding:12px; width:100%; font-size:14px; margin-top:18px; }
  .btn-primary:hover{background:#007b82;}
  .btn-secondary{ background:#fff; color:var(--navy); border:1.5px solid var(--line); padding:10px; width:100%; font-size:13px; margin-top:8px; }
  .btn-secondary:hover{border-color:var(--navy);}
  .divider{border:none; border-top:1px solid var(--line); margin:22px 0;}
  .catalog-item{ padding:9px 10px; border-radius:7px; cursor:pointer; font-size:13px; display:flex; justify-content:space-between; gap:8px; }
  .catalog-item:hover{background:var(--bg);}
  .catalog-item span.price{color:var(--turq); font-weight:600; white-space:nowrap;}
  .catalog-list{max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; margin-top:8px;}
  .main{padding:28px; overflow-y:auto;}
  .main-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .main-top h2{font-size:15px; color:var(--gray); margin:0; text-transform:uppercase; letter-spacing:.04em;}
  .queue-actions{display:flex; gap:10px;}
  .queue-actions button{padding:10px 18px; font-size:13px;}
  .print-btn{background:var(--navy); color:#fff;}
  .print-btn:hover{background:#003a5c;}
  .clear-btn{background:#fff; color:#b23b3b; border:1.5px solid #f0d5d5;}
  .clear-btn:hover{border-color:#b23b3b;}
  .empty-state{text-align:center; padding:80px 20px; color:var(--gray); font-size:14px;}

  /* ---- Label card: tamanho físico real (55mm x 35mm) sempre — igual no ecrã e na
     impressão, para nunca poder haver diferença entre os dois. O cartão é ampliado
     apenas visualmente (transform) para facilitar a edição no ecrã; a impressão
     desliga essa ampliação e usa o tamanho real diretamente. ---- */
  #labelGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:24px;}
  .label-card-wrap{ position:relative; width:99mm; height:63mm; }
  .label-card{
    position:absolute; top:0; left:0; width:55mm; height:35mm;
    transform:scale(1.8); transform-origin:top left;
    background:#fff; border:1.5px solid #b9c2c8; border-radius:4px; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .label-name-block{
    background:var(--navy); color:#fff; padding:8% 7%; font-weight:700; line-height:1.15;
    white-space:nowrap; overflow:hidden; flex-shrink:0;
  }
  .label-name-block span{display:inline-block;}
  .label-body{ padding:5% 7% 4%; flex:1; display:flex; flex-direction:column; }
  .label-price-row{display:flex; align-items:baseline; gap:8px; justify-content:center; width:100%;}
  .label-price{font-size:8.525mm; font-weight:700; color:var(--navy); line-height:1;}
  .label-ppk{font-size:2.75mm; font-weight:500; color:#5a6e78;}
  .label-iva{font-size:1.87mm; color:var(--gray); margin-top:2px; text-align:center;}
  .label-foot{display:flex; align-items:flex-end; gap:4%; margin-top:auto;}
  .label-bc-wrap{flex:1; min-width:0;}
  .label-bc-wrap svg.bcsvg{width:100%; height:8.8mm; display:block;}
  .label-ean{font-size:1.76mm; color:var(--gray); text-align:center; margin-top:1px;}
  .label-foot img.paw{width:8.25mm; height:auto; aspect-ratio:0.682; object-fit:contain; flex-shrink:0; margin-bottom:2px;}
  .remove-x{
    position:absolute; top:5px; right:5px; width:20px; height:20px; border-radius:50%;
    background:rgba(255,255,255,.9); color:var(--navy); font-size:12px; line-height:20px; text-align:center;
    cursor:pointer; font-weight:700; z-index:2; box-shadow:0 1px 3px rgba(0,0,0,.2);
  }

  @media print{
    header, .panel, .main-top{display:none !important;}
    body{background:#fff;}
    .layout{display:block;}
    .main{padding:0; overflow:visible;}
    #labelGrid{display:grid; grid-template-columns:repeat(3, 55mm); gap:5mm; justify-content:start;}
    .label-card-wrap{width:55mm; height:35mm; break-inside:avoid;}
    .label-card{position:static; transform:none; border:1px solid #ccc;}
    .remove-x{display:none;}
    /* Por definição, os browsers não imprimem cores de fundo (o azul-marinho do
       cabeçalho, etc.) a menos que se force explicitamente com esta propriedade —
       sem isto a etiqueta sai toda em branco/sem cor */
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    @page{ size:A4; margin:10mm; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Gerador de Etiquetas de Preço</h1>
    <p>Centro Veterinário Linda-a-Velha</p>
  </div>
  <div style="font-size:12px;color:#9fb3c2;">Adicione produtos à fila e imprima quando quiser</div>
</header>

<div class="layout">
  <div class="panel">

let queue = [];

function renderCatalog(filter){
  const list = document.getElementById('catalogList');
  const f = (filter||'').toLowerCase();
  const items = CATALOG.filter(p => p.desc.toLowerCase().includes(f)).slice(0,60);
  list.innerHTML = items.map((p) => {
    const idx = CATALOG.indexOf(p);
    return `<div class="catalog-item" onclick="addFromCatalog(${idx})">
      <span>${p.desc}</span>
      <span class="price">${p.pvp.toFixed(2).replace('.',',')}€</span>
    </div>`;
  }).join('') || '<div style="padding:10px;color:#6e7880;font-size:13px;">Sem resultados</div>';
}

document.getElementById('searchBox').addEventListener('input', e => renderCatalog(e.target.value));
renderCatalog('');

function addFromCatalog(idx){
  const p = CATALOG[idx];
  let unitPrice = null, unitLabel = null;
  if(p.ppk){ unitPrice = p.ppk; unitLabel = 'kg'; }
  else if(p.ppl){ unitPrice = p.ppl; unitLabel = 'L'; }
  else if(p.ppu){ unitPrice = p.ppu; unitLabel = 'un'; }
  queue.push({desc:p.desc, pvp:p.pvp, barcode:p.barcode, unitPrice, unitLabel});
  renderQueue();
}

function addManual(){
  const name = document.getElementById('manName').value.trim();
  const priceRaw = document.getElementById('manPrice').value.trim().replace(',', '.');
  const weightRaw = document.getElementById('manWeight').value.trim().replace(',', '.');
  const unitType = document.getElementById('manUnitType').value;
  const barcode = document.getElementById('manBarcode').value.trim();
  const price = parseFloat(priceRaw);
  const qty = parseFloat(weightRaw);
  if(!name || isNaN(price) || price <= 0){
    alert('Preencha pelo menos o nome e um preço válido.');
    return;
  }
  const hasQty = !isNaN(qty) && qty > 0;
  const unitPrice = hasQty ? price/qty : null;
  const unitLabel = hasQty ? unitType : null;
  queue.push({desc:name.toUpperCase(), pvp:price, barcode:barcode, unitPrice, unitLabel});
  document.getElementById('manName').value = '';
  document.getElementById('manPrice').value = '';
  document.getElementById('manWeight').value = '';
  document.getElementById('manBarcode').value = '';
  renderQueue();
}

function removeItem(i){
  queue.splice(i,1);
  renderQueue();
}

function clearQueue(){
  if(queue.length && !confirm('Limpar todas as etiquetas da fila?')) return;
  queue = [];
  renderQueue();
}

function fitPriceRows(){
  queue.forEach((item, i) => {
    const row = document.getElementById('priceText'+i)?.closest('.label-price-row');
    const priceEl = document.getElementById('priceText'+i);
    if(!row || !priceEl) return;
    const cardWidth = row.closest('.label-card').clientWidth;
    let size = cardWidth * 0.155;
    priceEl.style.fontSize = size+'px';
    const maxWidth = cardWidth * 0.86;
    let guard = 0;
    while(size > cardWidth*0.09 && row.scrollWidth > maxWidth && guard < 40){
      size -= cardWidth*0.005;
      priceEl.style.fontSize = size+'px';
      guard++;
    }
  });
}

function fitNameFonts(){
  queue.forEach((item, i) => {
    const block = document.getElementById('nameBlock'+i);
    const textEl = document.getElementById('nameText'+i);
    if(!block || !textEl) return;
    const blockWidth = block.clientWidth;
    let size = blockWidth * 0.088;
    textEl.style.fontSize = size+'px';
    const maxWidth = blockWidth - (blockWidth*0.14);
    let guard = 0;
    while(size > blockWidth*0.025 && textEl.scrollWidth > maxWidth && guard < 60){
      size -= blockWidth*0.0035;
      textEl.style.fontSize = size+'px';
      guard++;
    }
  });
}

window.addEventListener('resize', () => { if(queue.length){ fitNameFonts(); fitPriceRows(); } });

function saveQueue(){
  localStorage.setItem('cvla_etiquetas_fila', JSON.stringify(queue));
  alert('Fila guardada neste computador/navegador.');
}
function loadQueue(){
  const saved = localStorage.getItem('cvla_etiquetas_fila');
  if(!saved){ alert('Não há nenhuma fila guardada.'); return; }
  queue = JSON.parse(saved);
  renderQueue();
}

renderQueue();
